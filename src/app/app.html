<a class="skip-link" href="#main">Skip to main content</a>

    @if (store.user(); as user) {
      <nav class="navbar navbar-expand-md navbar-dark bg-primary" aria-label="Main">
        <div class="container">
          <a class="navbar-brand" routerLink="/applications">Merchant Portal</a>
          <button
            class="navbar-toggler"
            type="button"
            aria-controls="main-nav"
            [attr.aria-expanded]="menuOpen()"
            aria-label="Toggle navigation"
            (click)="menuOpen.set(!menuOpen())"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="navbar-collapse collapse" [class.show]="menuOpen()" id="main-nav">
            <ul class="navbar-nav me-auto">
              @for (link of links(); track link.path) {
                <li class="nav-item">
                  <a
                    class="nav-link"
                    [routerLink]="link.path"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: link.exact }"
                    ariaCurrentWhenActive="page"
                    (click)="menuOpen.set(false)"
                    >{{ link.label }}</a
                  >
                </li>
              }
            </ul>
            <span class="navbar-text me-3">
              {{ user.name }} <span class="badge text-bg-light ms-1">{{ user.role }}</span>
            </span>
            <button type="button" class="btn btn-outline-light btn-sm" (click)="auth.logout()">Sign out</button>
          </div>
        </div>
      </nav>
    }

    <main id="main" tabindex="-1" class="container py-4">
      <router-outlet />
    </main>
